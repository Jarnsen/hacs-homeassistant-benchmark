name: Ranking submission
description: Submit an anonymous standard-profile v3 benchmark result.
title: "Ranking submission: "
labels:
  - ranking
  - worldlist
body:
  - type: markdown
    attributes:
      value: |
        Create the payload with **Export ranking payload** in Home Assistant.
        GitHub recalculates every score from the submitted measurements. Hardware
        information is displayed only as comparison metadata.

  - type: textarea
    id: benchmark_json
    attributes:
      label: Anonymous benchmark JSON
      description: Paste the complete content of /config/benchmark_worldlist_export.json.
      render: json
      placeholder: |
        {
          "schema": "ha_homeassistant_performance_result_v3",
          "protocol_version": "3.0.0",
          "profile": "standard"
        }
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed the payload and want to publish these anonymous measurements and system metadata.
          required: true

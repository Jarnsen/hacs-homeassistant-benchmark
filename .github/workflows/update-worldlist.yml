name: Update worldlist

on:
  workflow_dispatch:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - reopened
      - closed

permissions:
  contents: write
  issues: read

concurrency:
  group: benchmark-worldlist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build validated worldlist
        run: python .github/scripts/build_worldlist.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit changed worldlist
        run: |
          if git diff --quiet -- docs/worldlist.json docs/worldlist.md; then
            echo "Worldlist unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/worldlist.json docs/worldlist.md
          git commit -m "Update validated benchmark worldlist"
          git push

name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            label: "Home Assistant 2025.12"
          - python: "3.14"
            label: "Home Assistant 2026.7"
    name: Test (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install minimum-version build tools
        if: matrix.python == '3.13'
        run: sudo apt-get update && sudo apt-get install --yes gcc
      - name: Install test environment
        run: python -m pip install -r requirements_test.txt
      - name: Run tests with full branch coverage
        run: python -m pytest --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

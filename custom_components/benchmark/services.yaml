start:
  name: Start benchmark
  description: Measure Home Assistant responsiveness without restarting.
  fields:
    profile:
      name: Profile
      description: Fixed measurement profile. Standard is required for ranking.
      required: false
      selector:
        select:
          options:
            - quick
            - standard
            - extended
    restart:
      name: Restart first
      description: Restart Home Assistant and continue the benchmark automatically.
      required: false
      default: false
      selector:
        boolean:

restart_and_run:
  name: Restart and run benchmark
  description: Restart Home Assistant, measure recovery time, and continue automatically.
  fields:
    profile:
      name: Profile
      description: Fixed measurement profile to run after startup.
      required: false
      selector:
        select:
          options:
            - quick
            - standard
            - extended

export:
  name: Export benchmark history
  description: Export v3 history as JSON and CSV in the Home Assistant config directory.

export_worldlist:
  name: Export worldlist result
  description: Export the latest standard result as a privacy-reduced comparison payload.

create_ranking_issue:
  name: Prepare ranking submission
  description: Export the latest standard result and show the GitHub ranking form.

setup_dashboard:
  name: Show dashboard YAML
  description: Show ready-to-copy dashboard YAML in a persistent notification.

create_issue:
  name: Report a problem
  description: Show a privacy-safe prefilled GitHub support issue.

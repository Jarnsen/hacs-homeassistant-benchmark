start:
  name: Start Real World Benchmark
  description: Runs the benchmark.
  fields:
    profile:
      name: Profile
      description: Benchmark profile to use.
      required: false
      default: normal
      selector:
        select:
          options:
            - light
            - normal
            - heavy
    restart:
      name: Restart Benchmark
      description: Restart Home Assistant and measure restart time.
      required: false
      default: false
      selector:
        boolean:

export:
  name: Export Benchmark
  description: Export full local benchmark results.
  fields: {}

export_worldlist:
  name: Export Worldlist
  description: Export the latest benchmark result for comparison.
  fields: {}

create_ranking_issue:
  name: Create Ranking Issue
  description: Create a prefilled GitHub issue for ranking submission.
  fields: {}

setup_dashboard:
  name: Setup Dashboard
  description: Generate Lovelace dashboard configuration.
  fields: {}

create_issue:
  name: Create GitHub Issue
  description: Create a prefilled GitHub support issue.
  fields: {}

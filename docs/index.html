<!DOCTYPE html><html><head><meta charset='utf-8'><title>Home Assistant Benchmark Leaderboard</title></head><body><h1>Home Assistant Benchmark Leaderboard</h1><p>Global ranking coming from benchmark submissions.</p><table border='1' id='tbl'><thead><tr><th>Rank</th><th>Score</th><th>Architecture</th><th>Storage</th></tr></thead><tbody></tbody></table><script>fetch('../leaderboard/leaderboard.json').then(r=>r.json()).then(data=>{const body=document.querySelector('#tbl tbody');(data.results||[]).sort((a,b)=>b.score-a.score).forEach((r,i)=>{body.innerHTML+=`<tr><td>${i+1}</td><td>${r.score}</td><td>${r.hardware?.architecture||''}</td><td>${r.hardware?.storage_type||''}</td></tr>`})})</script></body></html>

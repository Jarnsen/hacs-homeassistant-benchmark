title: Home Assistant Performance Benchmark
views:
  - title: Performance
    path: ha-performance
    icon: mdi:speedometer
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Home Assistant Performance
            icon: mdi:home-assistant
          - type: gauge
            entity: sensor.benchmark_score
            name: HA Performance Score
            min: 0
            max: 10000
            severity:
              red: 0
              yellow: 4000
              green: 7000
          - type: tile
            entity: sensor.benchmark_core_score
            name: HA Core Score
          - type: tile
            entity: sensor.benchmark_fluidity_score
            name: Fluidity Score
          - type: tile
            entity: sensor.benchmark_confidence
            name: Confidence
          - type: tile
            entity: button.benchmark_start_standard
            name: Start standard benchmark

      - type: grid
        cards:
          - type: heading
            heading: HA responsiveness (P95)
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.benchmark_event_loop_idle
            name: Event loop idle
          - type: tile
            entity: sensor.benchmark_event_loop_loaded
            name: Event loop under load
          - type: tile
            entity: sensor.benchmark_state_machine
            name: State machine
          - type: tile
            entity: sensor.benchmark_event_bus
            name: Event bus
          - type: tile
            entity: sensor.benchmark_service_calls
            name: Service calls
          - type: tile
            entity: sensor.benchmark_template_render
            name: Template rendering

      - type: grid
        cards:
          - type: heading
            heading: Status and history
            icon: mdi:history
          - type: tile
            entity: sensor.benchmark_status
            name: Status
          - type: tile
            entity: sensor.benchmark_progress
            name: Progress
          - type: tile
            entity: sensor.benchmark_last_run
            name: Last run
          - type: tile
            entity: sensor.benchmark_active_profile
            name: Profile
          - type: tile
            entity: sensor.benchmark_local_ranking
            name: Local best
          - type: history-graph
            title: Score history
            hours_to_show: 720
            entities:
              - sensor.benchmark_score
              - sensor.benchmark_core_score
              - sensor.benchmark_fluidity_score

      - type: grid
        cards:
          - type: heading
            heading: Advanced actions
            icon: mdi:tools
          - type: tile
            entity: button.benchmark_start_quick
            name: Quick check
          - type: tile
            entity: button.benchmark_start_extended
            name: Extended benchmark
          - type: tile
            entity: button.benchmark_restart_and_run
            name: Restart and benchmark
          - type: tile
            entity: button.benchmark_export_history
            name: Export history
          - type: tile
            entity: button.benchmark_export_worldlist
            name: Export ranking payload
          - type: tile
            entity: button.benchmark_prepare_ranking
            name: Prepare ranking submission
